services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse-course
    restart: unless-stopped

    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native ClickHouse protocol

    environment:
      CLICKHOUSE_DB: clickhouse_course
      CLICKHOUSE_USER: course
      CLICKHOUSE_PASSWORD: course
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
